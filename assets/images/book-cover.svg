<svg xmlns="http://www.w3.org/2000/svg" width="650" height="890" viewBox="0 0 650 890" role="img" aria-labelledby="title desc">
<title id="title">بطاقة تعريف المرجع: طرق البحث في الإدارة</title>
<desc id="desc">رسم تعريفي وليس نسخة فوتوغرافية من غلاف الكتاب الأصلي</desc>
<rect width="650" height="890" fill="#f5f7f6"/>
<rect x="36" y="36" width="578" height="818" rx="14" fill="#fff" stroke="#cddbdc" stroke-width="4"/>
<rect x="36" y="36" width="578" height="20" fill="#126b71"/>
<text x="325" y="135" font-size="22" text-anchor="middle" fill="#126b71" font-family="Tahoma,Arial" direction="rtl">المرجع الأكاديمي</text>
<text x="325" y="240" font-size="66" text-anchor="middle" font-weight="bold" fill="#13263a" font-family="Tahoma,Arial" direction="rtl">طرق البحث</text>
<text x="325" y="316" font-size="58" text-anchor="middle" font-weight="bold" fill="#13263a" font-family="Tahoma,Arial" direction="rtl">في الإدارة</text>
<text x="325" y="388" font-size="27" text-anchor="middle" fill="#44626d" font-family="Tahoma,Arial" direction="rtl">مدخل لبناء المهارات البحثية</text>
<path d="M130 445H520" stroke="#d8e8e6" stroke-width="5"/>
<text x="325" y="525" font-size="32" font-weight="bold" text-anchor="middle" fill="#17364b" font-family="Tahoma,Arial" direction="rtl">تأليف: أوما سيكاران</text>
<text x="325" y="595" font-size="22" text-anchor="middle" fill="#486173" font-family="Tahoma,Arial" direction="rtl">ترجمة: إسماعيل علي بسيوني</text>
<text x="325" y="640" font-size="22" text-anchor="middle" fill="#486173" font-family="Tahoma,Arial" direction="rtl">وعبدالله بن سليمان العزاز</text>
<rect x="93" y="713" width="465" height="84" rx="10" fill="#e4f2f2"/>
<text x="325" y="752" font-size="21" text-anchor="middle" fill="#0d4c64" font-family="Tahoma,Arial" direction="rtl">جامعة الملك سعود</text>
<text x="325" y="779" font-size="16" text-anchor="middle" fill="#32556c" font-family="Tahoma,Arial" direction="rtl">بطاقة تعريفية، وليست صورة الغلاف الأصلي</text>
</svg>